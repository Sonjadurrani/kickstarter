<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DMJU</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
      /* ===== Brand styling ===== */
      .navbar .brand-text{
          font-weight: 800;
          text-transform: uppercase;
          letter-spacing: .02em;
          line-height: 1.05;
          font-size: clamp(1.6rem, 1.2vw + 1.2rem, 2.6rem);
          white-space: nowrap;  /* keep brand on one line */
          color: #fff;
      }
      .navbar-brand img{ max-width: 95px; height: auto; }

      /* ===== Desktop layout (≥992px): grid with 2 rows =====
         Row 1: brand spans full width
         Row 2: nav (left) + search (right, separate element) */
      @media (min-width: 992px){
          /* Bootstrap sets .navbar .container-fluid to display:flex; override it */
          .navbar > .container-fluid.nav-grid{
              display: grid !important;
              grid-template-columns: 1fr auto; /* left: nav, right: search */
              grid-template-rows: auto auto;   /* row1 brand, row2 nav/search */
              column-gap: 1rem;
              row-gap: .25rem;
              align-items: end;
          }

          /* Row 1: brand takes full width */
          .navbar .nav-grid .navbar-brand{
              grid-column: 1 / -1;
              grid-row: 1;
          }

          /* Row 2: nav lives in the left column */
          .navbar .nav-grid #navbarSupportedContent{
              grid-column: 1 / 2;
              grid-row: 2;
              display: flex !important;
              align-items: flex-end;
              justify-content: flex-start;     /* start under the brand */
              padding-bottom: .125rem;         /* visually hug bottom edge */
              gap: 1rem;
          }

          /* Force nav links to a single line (no wrapping) */
          .navbar .nav-grid .navbar-nav{
              display: flex;
              flex-wrap: nowrap;
              gap: 1.25rem;
              margin-bottom: 0;
              white-space: nowrap;
          }
          .navbar .nav-grid .nav-link{
              white-space: nowrap;
              padding-bottom: .3rem;
          }

          /* Row 2: search sits in the right column */
          .navbar .nav-grid .search-form{
              grid-column: 2 / 3;
              grid-row: 2;
              justify-self: end;
              white-space: nowrap;
          }
          .navbar .nav-grid .search-form input{
              width: clamp(12rem, 20vw, 20rem); /* keep it from pushing layout */
          }
      }

      /* On tablet/phone, hide the long brand text to avoid crowding */
      @media (max-width: 991.98px){
          .navbar .brand-text{ display: none; }
      }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid nav-grid">
    <!-- Row 1: Logo + brand -->
    <a class="navbar-brand d-flex align-items-center gap-3" href="index.html">
      <img src="images/Logo.png" alt="DMJU logo" />
      <span class="brand-text">DANSK JERNBANE UNION</span>
    </a>

    <!-- Mobile toggler (shown only on <992px) -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Row 2 (left): nav links begin directly under the brand -->
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mb-0">
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">FORSIDE</a></li>
        <li class="nav-item"><a class="nav-link" href="#">OM OS</a></li>
        <li class="nav-item"><a class="nav-link" href="#">GALLERI</a></li>
        <li class="nav-item"><a class="nav-link" href="#">BEGIVENHEDER</a></li>
        <li class="nav-item"><a class="nav-link" href="#">MEDLEMSSIDE</a></li>
        <li class="nav-item"><a class="nav-link" href="#">ANDRE KLUBBER</a></li>
        <li class="nav-item"><a class="nav-link" href="#">DMJUS HJÆLPEVOGN</a></li>
        <li class="nav-item"><a class="nav-link" href="#">KONTAKT OS</a></li>
      </ul>
    </div>

    <!-- Row 2 (right): search (separate from the collapse so it can sit far right) -->
    <form class="d-none d-lg-flex mb-0 search-form" role="search">
      <label class="visually-hidden" for="siteSearch">Søg</label>
      <input id="siteSearch" class="form-control me-2" type="search" placeholder="Søg" aria-label="Søg" />
      <button class="btn btn-outline-light" type="submit">Søg</button>
    </form>
  </div>
</nav>

<!-- Optional main content -->
<main></main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
